# docker-compose.ec2.yml  (use this on your EC2 box)
version: "3.9"

services:
  api:
    # If you build on EC2, uncomment the next two lines and remove "image:"
    # build: .
    # image: week-api:latest
    image: week-api:latest
    container_name: api
    restart: unless-stopped
    ports:
      - "8000:8000"           # open 8000 in sg-api from your IP
    environment:
      # <<< set these for your environment >>>
      AWS_REGION: us-east-2
      # Prefer the secret NAME (portable) over the full ARN:
      DB_SECRET_ID: week/app-db-credentials
      # If your app expects DB_SECRET_ARN instead of DB_SECRET_ID, just rename the key.
      # Or, if your app expects DATABASE_URL, see the alt run command below.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # If your image needs extra env (e.g., UVICORN workers), add them here.
